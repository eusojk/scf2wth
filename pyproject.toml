[project]
name = "scf2wth"
version = "0.1.0"
description = "Orchestrates scfbridge -> FResampler1_PT -> wtd2wth to produce DSSAT-ready .WTH files from a seasonal climate forecast"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scfbridge[live]",
]

[tool.uv.sources]
# Local path dependency for now.
scfbridge = { path = "../scfbridge", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
scf2wth = "scf2wth:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"
